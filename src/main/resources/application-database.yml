spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10  # Maximum number of connections in the pool
      minimum-idle: 5        # Minimum number of idle connections
      idle-timeout: 30000    # Time in milliseconds before an idle connection is closed
      connection-timeout: 30000  # Time in milliseconds to wait for a connection from the pool
      max-lifetime: 600000   # Maximum lifetime of a connection in the pool
  sql:
    init:
      mode: always
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
    generate-ddl: true
  data:
    redis:
      jwt:
        host: redis1
        port: 6379
        password: babyy1023@
      schedule:
        host: redis2
        port: 6380
        password: babyy1023@
